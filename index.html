<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<meta name="theme-color" content="#101828" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Infinia Academy - October 2026 Course Calendar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#3448c5;--tuang:#ffe4e6;--lek:#dbeafe;--boom:#fef3c7;--baipak:#dcfce7;--base:#ede9fe}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#101828;color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
header h1{font-size:20px;margin:0 0 4px} header p{margin:0;color:#cfd4dc;font-size:13px}
.wrap{max-width:1400px;margin:auto;padding:16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab,select,label.toggle{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)} select{min-width:180px}.toggle{display:flex;align-items:center;gap:7px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.pill{padding:5px 9px;border-radius:999px;font-size:12px;border:1px solid #0001}.Tuang{background:var(--tuang)}.Lek{background:var(--lek)}.Boom{background:var(--boom)}.Baipak{background:var(--baipak)}.Base{background:var(--base)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:8px}.dow{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 6px}.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:175px;padding:8px;overflow:hidden}.day.dim{opacity:.52}.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.date{font-weight:750}.count{font-size:11px;color:var(--muted)}.period-row{display:grid;gap:4px;margin:4px 0;align-items:stretch}.event{border-radius:8px;padding:5px 6px;margin:0;font-size:11px;line-height:1.25;border:1px solid #0000000d;min-width:0}.event strong{font-size:12px}.event small{display:block;color:#475467;margin-top:2px}.empty{font-size:12px;color:#98a2b3;padding-top:8px}
.export-controls{display:flex;gap:6px;align-items:center;margin-left:auto}.export-controls select{min-width:120px}.export-btn{border:1px solid #293a9b;background:#3448c5;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}.export-btn:hover{filter:brightness(.96)}.export-btn:disabled{opacity:.55;cursor:wait}.print-context{display:none}.export-note{font-size:11px;color:var(--muted)}
@media print{@page{size:A3 landscape;margin:8mm}body{background:#fff}.toolbar,.export-controls{display:none!important}header{position:static;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none;padding:8px}.print-context{display:block;font-weight:700;margin:0 0 10px;color:#475467}.calendar{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{display:block}.day{min-height:0;break-inside:avoid}.panel,.stat,.event{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}.summary{grid-template-columns:repeat(5,1fr)}.event{font-size:9px}.event strong{font-size:10px}.event small{font-size:8px}}
@media(max-width:900px){.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.dow{display:none}.day{min-height:130px}}@media(max-width:560px){.calendar{grid-template-columns:1fr}.wrap{padding:10px}.day{min-height:auto}.toolbar{align-items:stretch}.tabs{width:100%}.tab{flex:1}.toolbar select{width:100%}}

.pathway-picker{position:relative;min-width:260px}
.pathway-picker[hidden]{display:none!important}
.pathway-picker-btn{width:100%;min-width:260px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 36px 9px 12px;font-size:14px;text-align:left;color:var(--text);cursor:pointer;position:relative}
.pathway-picker-btn:after{content:"▾";position:absolute;right:12px;top:8px;color:var(--muted);font-size:16px}
.pathway-menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(420px,92vw);max-height:390px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #10182824;padding:8px}
.pathway-menu[hidden]{display:none!important}
.pathway-menu-head{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:5px}
.pathway-menu-head span{font-size:12px;color:var(--muted)}
.pathway-action{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px}
.pathway-option{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.pathway-option:hover{background:#f5f7ff}
.pathway-option input{margin:0;width:16px;height:16px}
.pathway-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.pathway-legend{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.pathway-legend[hidden]{display:none!important}
.pathway-key{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px}
.pathway-key i{width:14px;height:14px;border:3px solid currentColor;border-radius:4px;background:#fff;display:inline-block}
.event.path-outlined{box-shadow:inset 0 0 0 3px var(--path-outline)}
@media(max-width:560px){.pathway-picker,.pathway-picker-btn{width:100%;min-width:0}.pathway-menu{width:100%}}

</style>
</head>

function coursePathMembership(course){
 const selected=getSelectedPathways();
 if(course==='EFC' && selected.length>1) return selected;

}
function coursePathOutline(course){
 const selected=getSelectedPathways();
 if(view!=='student' || selected.length<=1) return null;

}

}

 if(view==='overview') return data;

function renderSummary(ev){
 const days=new Set(ev.map(e=>e.date)).size;const periodsCount=ev.length;const courses=new Set(ev.map(e=>e.course)).size;const maxDay=Math.max(0,...[...new Set(ev.map(e=>e.date))].map(d=>ev.filter(e=>e.date===d).length));
 let html=`<div class="stat"><b>${periodsCount}</b><span>Periods shown</span></div><div class="stat"><b>${days}</b><span>Active days</span></div><div class="stat"><b>${courses}</b><span>Courses shown</span></div><div class="stat"><b>${maxDay}</b><span>Max periods in a shown day</span></div>`;
 if(view==='teacher'){const t=teacherSelect.value; const offs=31-days; html+=`<div class="stat"><b>${offs}</b><span>Days without teaching</span></div>`}

}
function renderCalendar(ev){
 const first=new Date(2026,9,1); const startOffset=(first.getDay()+6)%7; let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('');
 for(let i=0;i<startOffset;i++) html+='<div></div>';
 for(let d=1;d<=31;d++){
  const ds=`2026-10-${String(d).padStart(2,'0')}`;const dayEv=ev.filter(e=>e.date===ds).sort((a,b)=>a.period-b.period||a.course.localeCompare(b.course));
  html+=`<div class="day"><div class="dayhead"><span class="date">${d} ${fmtDay(ds)}</span><span class="count">${dayEv.length}P</span></div>`;
  if(dayEv.length){
   const byPeriod={};
   dayEv.forEach(e=>(byPeriod[e.period]??=[]).push(e));
   html+=Object.keys(byPeriod).sort((a,b)=>a-b).map(p=>{
    const same=byPeriod[p];
    const cols=Math.max(1,same.length);
    return `<div class="period-row" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${same.map(e=>{

      const cls=outline?' path-outlined':'';

}
